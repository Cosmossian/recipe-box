<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a chunky, outlined kitchen-ticket look. Meal colors (yolk, herb, plum) do the color work; ink outlines and hard offset shadows give it punch. */
:root{
  --bg:#EDEFE8;
  --surface:#FFFFFF;
  --ink:#17201A;
  --muted:#5B665D;
  --line:#17201A;
  --soft:#DDE2D6;
  --shadow:#17201A;
  --breakfast:#F5B400;
  --lunch:#2E9E5B;
  --dinner:#7A4BC2;
  --dessert:#FF6FA8;
  --on-meal:#17201A;
  --danger:#D93B1F;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111512; --surface:#1A201C; --ink:#EDF1E9; --muted:#A3AEA5; --line:#3C463F; --soft:#262E28; --shadow:#000000;
    --breakfast:#FFC628; --lunch:#3DBA70; --dinner:#A07BE0; --dessert:#FF8DBC; --danger:#FF6A4D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A201C; --ink:#EDF1E9; --muted:#A3AEA5; --line:#3C463F; --soft:#262E28; --shadow:#000000;
  --breakfast:#FFC628; --lunch:#3DBA70; --dinner:#A07BE0; --dessert:#FF8DBC; --danger:#FF6A4D;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--breakfast);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-0.02em}

.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

/* Header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border:2px solid var(--line);border-radius:14px;background:var(--breakfast);box-shadow:4px 4px 0 var(--shadow);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand h1{font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1 1 auto;justify-content:flex-end;min-width:0}
.brand .who{margin:4px 0 0;font-size:13px;color:var(--muted)}
.link-btn{border:none;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.search{position:relative}
.auth-box:empty{display:none}
.search{flex:0 1 330px;min-width:200px}
.search input{width:100%;text-overflow:ellipsis;padding:11px 14px 11px 40px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .12s, box-shadow .12s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.yolk{background:var(--breakfast);color:#17201A}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft);transform:none}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--shadow)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;padding:0;justify-content:center}

/* Meal tabs */
.tabs{display:flex;gap:12px;margin:28px 0 18px;flex-wrap:wrap;align-items:stretch}
.tab{flex:1 1 140px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .12s, box-shadow .12s}
.tab:hover{transform:translateY(-2px)}
.tab .t-label{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.tab .t-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{box-shadow:5px 5px 0 var(--shadow);transform:translate(-2px,-2px)}
.tab[aria-pressed="true"] .t-sub{color:inherit;opacity:.8}
.tab[data-meal="all"][aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab[data-meal="breakfast"][aria-pressed="true"]{background:var(--breakfast);color:#17201A}
.tab[data-meal="lunch"][aria-pressed="true"]{background:var(--lunch);color:#0E1A12}
.tab[data-meal="dinner"][aria-pressed="true"]{background:var(--dinner);color:#fff}
.tab[data-meal="dessert"][aria-pressed="true"]{background:var(--dessert);color:#17201A}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-right:6px;vertical-align:1px}
.dot.breakfast{background:var(--breakfast)} .dot.lunch{background:var(--lunch)} .dot.dinner{background:var(--dinner)} .dot.dessert{background:var(--dessert)}

.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.toolbar .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar .left label{line-height:38px}
.sel{position:relative;display:inline-flex}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
/* Auth */
.auth-box{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form .inp{width:100%}
.link-btn{background:none;border:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
/* Embeds */
.embed{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#000}
.embed iframe{display:block;width:100%;height:100%;border:0}
.embed.wide{max-width:720px;aspect-ratio:16/9}
.embed.tall{width:min(340px,100%);height:740px}
.embed.insta{width:min(400px,100%);height:720px;background:#fff}
/* Video */
.video-box{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#000;max-width:420px}
.video-box video{display:block;width:100%;max-height:640px;background:#000}
.watch-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vid-chip{position:absolute;bottom:10px;left:12px;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:#17201A;color:#fff;font-size:12px;font-weight:700;border:2px solid #fff}
.form .video-box{max-width:320px}
.chip-toggle{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;line-height:1;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip-toggle[aria-pressed="true"]{background:var(--danger);color:#fff;border-color:var(--line)}
select.sort{appearance:none;-webkit-appearance:none;height:38px;padding:0 38px 0 14px;line-height:1;vertical-align:middle;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);transition:transform .15s, box-shadow .15s;text-align:left;padding:0}
.card:hover{transform:translate(-2px,-3px) rotate(-.4deg);box-shadow:7px 8px 0 var(--shadow)}
.card .ph{aspect-ratio:4/3;border-bottom:2px solid var(--line);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .c-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:21px;font-weight:700;line-height:1.15}
.meta{display:flex;gap:12px;color:var(--muted);font-size:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:15px;height:15px}
.meal-chip{position:absolute;top:12px;left:12px;padding:4px 10px;border:2px solid #17201A;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#17201A;z-index:1}
.meal-chip.breakfast,.pill.breakfast{background:var(--breakfast);color:#17201A}
.meal-chip.lunch,.pill.lunch{background:var(--lunch);color:#0E1A12}
.meal-chip.dinner,.pill.dinner{background:var(--dinner);color:#fff}
.meal-chip.dessert,.pill.dessert{background:var(--dessert);color:#17201A}
.fav-btn{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:2px solid #17201A;background:#fff;color:#17201A;display:grid;place-items:center;cursor:pointer;padding:0}
.fav-btn svg{width:18px;height:18px}
.fav-btn[aria-pressed="true"]{background:var(--danger);color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.tag.example{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}

/* Placeholder art */
.art{width:100%;height:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.art.breakfast{background:var(--breakfast)}
.art.lunch{background:var(--lunch)}
.art.dinner{background:var(--dinner)}
.art.dessert{background:var(--dessert)}
.art::before{content:"";position:absolute;inset:-20%;background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.18) 1.6px, transparent 0);background-size:18px 18px;transform:rotate(12deg)}
.art .letter{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(70px,9vw,120px);line-height:1;color:#fff;-webkit-text-stroke:2px #17201A;text-shadow:5px 5px 0 #17201A;transform:rotate(-6deg)}
.art .plate{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(23,32,26,.55);background:rgba(255,255,255,.18)}

/* Empty / status */
.empty{border:2px dashed var(--muted);border-radius:18px;padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-size:24px}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.banner{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);font-size:14px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner b{font-weight:700}

/* Overlay + sheets */
.overlay{position:fixed;inset:0;background:rgba(10,14,11,.55);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:50}
.overlay[hidden]{display:none}
.sheet{width:min(980px,100%);background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:8px 8px 0 var(--shadow);overflow:hidden;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.98)}to{transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:3}
.sheet-head .acts{display:flex;gap:8px;flex-wrap:wrap}

.hero{height:clamp(220px,38vw,380px);border-bottom:2px solid var(--line);position:relative;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .art .letter{font-size:clamp(110px,16vw,190px)}
.d-body{padding:24px clamp(18px,4vw,40px) 36px;display:flex;flex-direction:column;gap:22px}
.pill{display:inline-block;padding:4px 12px;border:2px solid #17201A;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.d-title{font-size:clamp(32px,5vw,52px);font-weight:800;line-height:1.02;margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:2px solid var(--line);border-radius:14px;overflow:hidden}
.fact{padding:12px 16px;border-right:2px solid var(--line)}
.fact:last-child{border-right:none}
.fact .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.fact .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800;line-height:1;padding:0}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sec-h h3{font-size:24px}
.ing-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ing-list li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1.5px dashed var(--soft)}
.ing-list input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;background:var(--surface)}
.ing-list input[type=checkbox]:checked{background:var(--lunch)}
.ing-list input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #0E1A12;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ing-list li.done .ing-text{text-decoration:line-through;opacity:.55}
.ing-text{flex:1}
.qty{font-weight:700;font-variant-numeric:tabular-nums}
.ing-link{display:inline-flex;align-items:center;gap:3px;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--breakfast)}
.ing-link svg{width:13px;height:13px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;cursor:pointer;max-width:62ch}
.steps li::before{content:counter(s);width:36px;height:36px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--bg)}
.steps li.done{opacity:.45}
.steps li.done::before{background:var(--lunch);color:#0E1A12}
.part-h{font-family:var(--display);font-size:18px;font-weight:800;margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.part-h:first-child{margin-top:0}
.steps + .part-h{margin-top:26px}
.part-main{gap:14px}
.equip-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));column-gap:28px}
.total{border:2px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--bg);scroll-margin-top:80px}
.total .from{font-size:12px;color:var(--muted);font-weight:600;margin-left:8px;white-space:nowrap}
.parts-note{margin:-6px 0 0;font-size:14px;color:var(--muted)}
.part-box{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.part-box .inp{background:var(--surface)}
.part-top{display:flex;gap:8px;align-items:flex-end}
.part-top .field{flex:1}
.notes{background:var(--soft);border-radius:14px;padding:16px 18px;white-space:pre-wrap;max-width:75ch}
.source{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:18px}
.source .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* Form */
.form{padding:22px clamp(18px,4vw,36px) 30px;display:flex;flex-direction:column;gap:20px}
.form h2{font-size:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:700;font-size:14px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.inp{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1 1 110px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;font-weight:700;background:var(--bg)}
.seg input:focus-visible + span{outline:3px solid var(--breakfast);outline-offset:2px}
.seg input[value="breakfast"]:checked + span{background:var(--breakfast);color:#17201A;box-shadow:3px 3px 0 var(--shadow)}
.seg input[value="lunch"]:checked + span{background:var(--lunch);color:#0E1A12;box-shadow:3px 3px 0 var(--shadow)}
.seg input[value="dinner"]:checked + span{background:var(--dinner);color:#fff;box-shadow:3px 3px 0 var(--shadow)}
.seg input[value="dessert"]:checked + span{background:var(--dessert);color:#17201A;box-shadow:3px 3px 0 var(--shadow)}
.drop{border:2px dashed var(--line);border-radius:16px;min-height:170px;display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer;background:var(--bg);position:relative;overflow:hidden}
.drop.over{background:var(--soft);border-style:solid}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .drop-msg{position:relative;display:flex;flex-direction:column;gap:4px;align-items:center}
.drop .drop-msg strong{font-family:var(--display);font-size:20px}
.photo-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ing-rows{display:flex;flex-direction:column;gap:8px}
.ing-row{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.ing-row .inp{padding:8px 10px}
.ing-head{display:grid;grid-template-columns:110px minmax(0,1.4fr) minmax(0,1fr) 40px;gap:8px;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
details.paste{border:2px solid var(--line);border-radius:14px;background:var(--bg)}
details.paste summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.paste summary::-webkit-details-marker{display:none}
details.paste summary::after{content:"+";font-family:var(--display);font-weight:800}
details.paste[open] summary::after{content:"–"}
details.paste .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.form-foot{display:flex;justify-content:flex-end;gap:10px;border-top:2px solid var(--line);padding-top:18px;flex-wrap:wrap}
.err{color:var(--danger);font-weight:600;font-size:14px}

/* Confirm + toast */
.confirm{width:min(420px,100%);margin-top:18vh;background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.confirm h3{font-size:22px}
.confirm p{margin:0;color:var(--muted)}
.confirm .acts{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:4px 4px 0 var(--breakfast);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.bulk-box[hidden]{display:none}

/* Pantry + what can I make */
.p-add{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:8px}
.p-chips{display:flex;flex-wrap:wrap;gap:8px}
.p-sug{border:2px dashed var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;cursor:pointer}
.p-sug:hover{background:var(--soft);border-style:solid}
.p-item{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 5px 4px 12px;font-weight:600;font-size:14px}
.p-qty{font-weight:800;font-size:12px;background:var(--breakfast);color:#17201A;border-radius:999px;padding:1px 7px;margin-left:-2px}
.p-item button{border:none;background:var(--soft);color:var(--ink);border-radius:50%;width:24px;height:24px;cursor:pointer;line-height:1;font-weight:800;padding:0;display:grid;place-items:center}
.p-item button:hover{background:var(--danger);color:#fff}
.p-group h3{font-size:19px;margin-bottom:8px}
.p-check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.p-check input{width:20px;height:20px;accent-color:var(--lunch)}
.cook-top{background:var(--breakfast);color:#17201A;border:2px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:4px 4px 0 var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cook-top h2{font-size:clamp(24px,4vw,34px);line-height:1.05}
.cook-top p{margin:4px 0 0;font-weight:600}
.cook-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.cook-card{border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:3px 3px 0 var(--shadow);display:grid;grid-template-columns:96px 1fr;overflow:hidden;cursor:pointer;transition:transform .12s, box-shadow .12s}
.cook-card:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.cook-card .cc-ph{border-right:2px solid var(--line);position:relative;min-height:96px}
.cook-card .cc-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cook-card .cc-ph .art .letter{font-size:44px}
.cook-card .cc-b{padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cook-card h4{font-size:17px;line-height:1.15}
.cook-card .cc-m{font-size:13px;color:var(--muted)}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.miss .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.miss button{font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 9px;cursor:pointer}
.miss button:hover{background:var(--lunch);color:#0E1A12}
.have-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-left:8px;white-space:nowrap}
@media (max-width:560px){ .p-add{grid-template-columns:1fr auto} .p-add select{grid-column:1 / -1;grid-row:2} }

/* Recommendations */
.recs{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;margin-bottom:26px}
.rec{border:2px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:4px 4px 0 var(--shadow);display:grid;grid-template-columns:150px 1fr;overflow:hidden}
.rec .r-ph{border-right:2px solid var(--line);min-height:150px;position:relative}
.rec .r-ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rec .r-ph .art .letter{font-size:64px}
.rec .r-body{padding:16px 18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rec h3{font-size:22px;line-height:1.15}
.rec p{margin:0;color:var(--muted);font-size:14px}
.rec.online{grid-template-columns:1fr;background:var(--ink);color:var(--bg)}
.rec.online .eyebrow,.rec.online p{color:inherit;opacity:.75}
.stars{color:var(--breakfast);font-size:15px;letter-spacing:1px;-webkit-text-stroke:.6px var(--ink);line-height:1}
.stars .off{color:transparent;-webkit-text-stroke:.8px var(--muted)}
.stars.inline{font-size:18px;vertical-align:-2px}
.pick-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.rec.online .btn:not(.yolk):not(.ghost){background:var(--surface);color:var(--ink)}
.rec.online .btn.ghost.light{color:var(--bg)}
.rec.online .btn.ghost.light:hover{background:rgba(255,255,255,.12)}
.rec.online h3 a:hover{text-decoration:underline}
.more-link{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;opacity:.85;margin-top:4px}
.recs.solo{grid-template-columns:minmax(0,1fr);max-width:640px}
.by{font-size:13px;color:var(--muted)}
.by b{color:var(--ink);font-weight:700}
.made-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:860px){ .recs{grid-template-columns:1fr} }
@media (max-width:460px){ .rec{grid-template-columns:1fr} .rec .r-ph{border-right:none;border-bottom:2px solid var(--line);min-height:140px} }

@media (max-width:760px){
  .cols{grid-template-columns:1fr;gap:28px}
  .overlay{padding:0}
  .sheet{border-radius:0;border-left:none;border-right:none;min-height:100%;box-shadow:none}
  .ing-row,.ing-head{grid-template-columns:80px minmax(0,1fr) 40px}
  .ing-row .link-inp{grid-column:1 / 3}
  .ing-head span:nth-child(3){display:none}
  .fact{border-right:none;border-bottom:2px solid var(--line)}
  .fact:last-child{border-bottom:none}
}
@media (max-width:640px){
  .top-actions{width:100%}
  .search{flex:1 1 100%}
  .search input{width:100%}
}
@media (max-width:420px){
  .wrap{padding:18px 16px 60px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

<script>
(function(){
"use strict";

/* ---------- constants & helpers ---------- */
const MEALS = {
  breakfast:{label:"Breakfast", sub:"Rise and shine"},
  lunch:{label:"Lunch", sub:"Midday fuel"},
  dinner:{label:"Dinner", sub:"The main event"},
  dessert:{label:"Dessert", sub:"Something sweet"}
};
const ICON = {
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try{ const x = new URL(String(u||"").trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } };
const domainOf = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } };
const newId = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = parseInt(v,10); return Number.isFinite(n) && n > 0 ? n : 0; };
const fmtMin = m => !m ? "" : m < 60 ? m + " min" : Math.floor(m/60) + " hr" + (m%60 ? " " + (m%60) + " min" : "");
const totalMin = r => num(r.prepMin) + num(r.cookMin);
/* A recipe can have extra parts (a sauce, crust, filling, marinade, side…), each with its own ingredients and steps.
   The main part lives in r.ingredients / r.steps (named by r.mainName); extras live in r.parts. */
const blankIng = () => ({qty:"", item:"", url:""});
function partsOf(r){
  const extra = (r.parts || []).filter(p => p && (p.name || (p.ingredients||[]).length || (p.steps||[]).length));
  return [{name: r.mainName || "", ingredients: r.ingredients || [], steps: r.steps || []}]
    .concat(extra.map(p => ({name: p.name || "", ingredients: p.ingredients || [], steps: p.steps || []})));
}
const partLabel = (p, i) => p.name || "Part " + (i + 1);
const allIngredients = r => partsOf(r).flatMap(p => p.ingredients);
/* Total ingredients: every part combined into one shopping list, with matching items added together. */
const UNIT_ALIASES = {tbsp:["tbsp","tbsps","tbs","tablespoon","tablespoons","tbl"], tsp:["tsp","tsps","teaspoon","teaspoons"], cup:["cup","cups","c"], oz:["oz","ounce","ounces"], lb:["lb","lbs","pound","pounds"], g:["g","gram","grams"], kg:["kg","kilogram","kilograms"], ml:["ml","milliliter","milliliters"], clove:["clove","cloves"], can:["can","cans"], stick:["stick","sticks"], slice:["slice","slices"], "":[""]};
const UNIT_OF = {}; Object.entries(UNIT_ALIASES).forEach(([k, list]) => list.forEach(a => UNIT_OF[a] = k));
const UNIT_SHOW = {tbsp:["tbsp","tbsp"], tsp:["tsp","tsp"], cup:["cup","cups"], oz:["oz","oz"], lb:["lb","lbs"], g:["g","g"], kg:["kg","kg"], ml:["ml","ml"], clove:["clove","cloves"], can:["can","cans"], stick:["stick","sticks"], slice:["slice","slices"], "":["",""]};
function parseQty(q){
  let s = String(q||"").trim();
  if (!s) return null;
  const m = s.match(NUM_RE); if (!m) return null;
  let v = tokenVal(m[0]); s = s.slice(m[0].length);
  const fr = s.match(/^\s+([½⅓⅔¼¾⅛⅜⅝⅞])/); if (fr){ v += UNI[fr[1]]; s = s.slice(fr[0].length); }
  if (/^\s*[-–]\s*\d/.test(s) || !Number.isFinite(v)) return null;
  const unitRaw = s.trim().toLowerCase().replace(/\.$/, "");
  if (!(unitRaw in UNIT_OF)) return {v, unit: "raw:" + unitRaw, raw: s.trim()};
  return {v, unit: UNIT_OF[unitRaw]};
}
/* Kitchen-friendly scaling: amounts are converted and rounded to what measuring cups and spoons can do. */
const VOL_TSP = {tsp:1, tbsp:3, cup:48};
const COUNT_UNITS = new Set(["", "clove", "can", "stick", "slice"]);
const isCountUnit = u => COUNT_UNITS.has(u) || String(u).startsWith("raw:");
const roundTo = (v, step) => Math.round(v / step) * step;
const SPOONS = [0.125, 0.25, 0.5, 0.75, 1];
function fmtTspOnly(tsp){
  if (tsp >= 2.6) return "1 tbsp";
  const t = tsp <= 1 ? SPOONS.reduce((a, b) => Math.abs(b - tsp) <= Math.abs(a - tsp) ? b : a) : roundTo(tsp, 0.25);
  return fmtNum(t) + " tsp";
}
function fmtTbsp(tsp){
  let tb = Math.floor(tsp / 3 + 1e-6), rem = roundTo(tsp - tb * 3, 0.25);
  if (rem >= 3){ tb++; rem = 0; }
  if (Math.abs(rem - 1.5) < 1e-6) return fmtNum(tb + 0.5) + " tbsp";
  if (!tb) return fmtTspOnly(rem);
  return tb + " tbsp" + (rem ? " + " + fmtNum(rem) + " tsp" : "");
}
function fmtVol(tsp){
  if (tsp < 0.1) return "pinch";
  if (tsp < 2.9) return fmtTspOnly(tsp);
  if (tsp < 11.5) return fmtTbsp(tsp);
  const cups = tsp / 48, tol = 0.75 / 48;
  const whole = Math.floor(cups + tol);
  let best = whole;
  [1/4, 1/3, 1/2, 2/3, 3/4].forEach(fr => { if (whole + fr <= cups + tol) best = whole + fr; });
  const remTsp = (cups - best) * 48;
  if (remTsp > 0.75 && tsp <= 24 && Math.abs(tsp / 1.5 - Math.round(tsp / 1.5)) < 0.1) return fmtTbsp(tsp);
  const cupTxt = best > 0 ? fmtNum(best) + " " + (best > 1 ? "cups" : "cup") : "";
  if (remTsp <= Math.max(0.75, tsp * 0.04) || !cupTxt) return cupTxt || fmtTbsp(tsp);
  return cupTxt + " + " + fmtVol(remTsp);
}
function fmtUnit(v, unit, raw){
  if (unit in VOL_TSP) return fmtVol(v * VOL_TSP[unit]);
  if (unit === "lb") return v < 1 ? fmtUnit(v * 16, "oz") : fmtNum(roundTo(v, 0.25)) + (v > 1 ? " lbs" : " lb");
  if (unit === "oz") return fmtNum(Math.max(0.5, roundTo(v, 0.5))) + " oz";
  if (unit === "kg") return v < 1 ? fmtUnit(v * 1000, "g") : fmtNum(roundTo(v, 0.1)) + " kg";
  if (unit === "g" || unit === "ml") return Math.max(1, Math.round(v)) + " " + unit;
  const n = fmtNum(Math.max(0.5, roundTo(v, 0.5)));
  if (unit.startsWith("raw:")) return (n + " " + (raw || "")).trim();
  const show = UNIT_SHOW[unit] || ["", ""];
  return (n + " " + (roundTo(v, 0.5) > 1 ? show[1] : show[0])).trim();
}
function scaleSmart(qty, f){
  if (!qty || f === 1) return qty;
  const q = parseQty(qty);
  if (!q) return scaleQty(qty, f);
  return fmtUnit(q.v * f, q.unit, q.raw);
}
/* Which serving counts work: at least a quarter batch, and countable things (eggs, cans, cloves…) come out whole or in halves. */
function servingSteps(r){
  const base = num(r.servings);
  if (!base) return [];
  const counts = allIngredients(r).map(i => parseQty(i.qty)).filter(q => q && isCountUnit(q.unit));
  const floor = Math.max(1, Math.ceil(base / 4)), max = Math.min(99, Math.max(base * 4, 12));
  const ok = s => counts.every(q => { const v = q.v * s / base; return v >= 0.5 - 1e-9 && Math.abs(v * 2 - Math.round(v * 2)) < 0.06; });
  const out = [];
  for (let s = floor; s <= max; s++) if (s === base || ok(s)) out.push(s);
  return out;
}
function totalIngredients(r, f){
  f = f || 1;
  const ps = partsOf(r), multi = ps.length > 1;
  const groups = new Map();
  ps.forEach((p, pi) => p.ingredients.forEach(ing => {
    if (!String(ing.item||"").trim() && !String(ing.qty||"").trim()) return;
    const k = (typeof pKey === "function" ? pKey(ing.item) : "") || String(ing.item||"").toLowerCase().trim();
    if (!groups.has(k)) groups.set(k, {list: [], parts: new Set()});
    const g = groups.get(k); g.list.push(ing); g.parts.add(partLabel(p, pi));
  }));
  return [...groups.values()].map(g => {
    const first = g.list[0];
    if (g.list.length === 1) return {qty: scaleSmart(first.qty, f), item: first.item, url: safeUrl(first.url), from: multi ? [...g.parts] : [], src: first};
    let vol = 0, oz = 0; const sums = new Map(), extra = [];
    g.list.forEach(i => {
      const q = parseQty(i.qty);
      if (!q){ if (String(i.qty||"").trim()) extra.push(scaleSmart(i.qty, f)); return; }
      const v = q.v * f;
      if (q.unit in VOL_TSP) vol += v * VOL_TSP[q.unit];
      else if (q.unit === "oz" || q.unit === "lb") oz += q.unit === "lb" ? v * 16 : v;
      else { const cur = sums.get(q.unit) || {v:0, raw:q.raw}; cur.v += v; sums.set(q.unit, cur); }
    });
    const bits = [];
    if (vol) bits.push(fmtVol(vol));
    if (oz) bits.push(oz >= 16 ? fmtUnit(oz / 16, "lb") : fmtUnit(oz, "oz"));
    sums.forEach((c, u) => bits.push(f === 1 && isCountUnit(u) ? (fmtNum(c.v) + " " + (u.startsWith("raw:") ? c.raw : (UNIT_SHOW[u] || ["",""])[c.v > 1 ? 1 : 0])).trim() : fmtUnit(c.v, u, c.raw)));
    const name = String(first.item||"").split(",")[0].trim();
    return {qty: bits.concat(extra).join(" + "), item: name, url: safeUrl((g.list.find(i => safeUrl(i.url)) || {}).url), from: [...g.parts], merged: true, src: first};
  });
}
function equipSection(r){
  const list = (r.equipment || []).filter(e => String(e).trim());
  if (!list.length) return "";
  return '<section class="equip"><h3 style="font-size:24px;margin-bottom:10px">Equipment</h3><ul class="ing-list equip-list">' + list.map((e, i) => {
    const key = "e-" + i, done = state.checkedIng.has(key);
    return '<li class="' + (done ? "done" : "") + '"><input type="checkbox" data-ing="' + key + '"' + (done ? " checked" : "") + ' aria-label="Got out ' + esc(e) + '"><span class="ing-text">' + esc(e) + '</span></li>';
  }).join("") + '</ul></section>';
}
function totalSection(r, f, sv, showHave){
  const list = totalIngredients(r, f);
  return '<section class="total" id="totalList"><div class="sec-h"><h3>Total ingredients</h3><button class="btn sm" type="button" data-act="copy">Copy list</button></div>' +
    '<p class="hint" style="margin:0 0 8px">Everything from all ' + partsOf(r).length + ' parts in one shopping list' + (f !== 1 ? ', scaled for ' + sv + ' servings' : '') + '. Matching items are added together.</p>' +
    '<ul class="ing-list">' + list.map((t, i) => {
      const key = "t-" + i, done = state.checkedIng.has(key);
      const item = t.url ? '<a class="ing-link" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.item) + ICON.ext + '</a>' : esc(t.item);
      return '<li class="' + (done ? "done" : "") + '"><input type="checkbox" data-ing="' + key + '"' + (done ? " checked" : "") + ' aria-label="Got ' + esc(t.item) + '"><span class="ing-text">' +
        (t.qty ? '<span class="qty">' + esc(t.qty) + '</span> ' : "") + item +
        (t.from.length ? '<span class="from">' + esc(t.from.join(" + ")) + '</span>' : "") +
        (showHave && inPantry(t.src) ? '<span class="have-tag">✓ In pantry</span>' : "") + '</span></li>';
    }).join("") + '</ul></section>';
}

/* ---------- quantity scaling ---------- */
const UNI = {"½":.5,"⅓":1/3,"⅔":2/3,"¼":.25,"¾":.75,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
const NUM_RE = /^(\d+\s+\d+\/\d+|\d+\/\d+|\d*[½⅓⅔¼¾⅛⅜⅝⅞]|\d+(?:\.\d+)?)/;
function tokenVal(t){
  t = t.trim();
  let m;
  if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = t.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if ((m = t.match(/^(\d*)([½⅓⅔¼¾⅛⅜⅝⅞])$/))) return (m[1] ? +m[1] : 0) + UNI[m[2]];
  return parseFloat(t);
}
function fmtNum(n){
  if (Math.abs(n - Math.round(n)) < 0.04) return String(Math.round(n));
  const whole = Math.floor(n), frac = n - whole;
  const F = [[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[3/8,"⅜"],[1/2,"½"],[5/8,"⅝"],[2/3,"⅔"],[3/4,"¾"],[7/8,"⅞"]];
  for (const [v,s] of F) if (Math.abs(frac - v) < 0.035) return (whole ? whole : "") + s;
  return (Math.round(n*10)/10).toString();
}
function scaleQty(q, f){
  if (!q || f === 1) return q;
  const s = String(q);
  const m1 = s.match(NUM_RE);
  if (!m1) return q;
  let rest = s.slice(m1[0].length);
  let out = fmtNum(tokenVal(m1[0]) * f);
  const m2 = rest.match(/^\s*[-–]\s*/);
  if (m2){
    const r2 = rest.slice(m2[0].length).match(NUM_RE);
    if (r2){ out += "–" + fmtNum(tokenVal(r2[0]) * f); rest = rest.slice(m2[0].length + r2[0].length); }
  }
  return out + rest;
}

/* ---------- parsing pasted text ---------- */
const UNITS = "cups?|c\\.?|tablespoons?|tbsps?\\.?|tbs\\.?|teaspoons?|tsps?\\.?|ounces?|oz\\.?|pounds?|lbs?\\.?|grams?|g|kilograms?|kg|ml|milliliters?|liters?|l|cloves?|cans?|pinch(?:es)?|dash(?:es)?|sticks?|slices?|pieces?|bunch(?:es)?|handfuls?|sprigs?|quarts?|qt|pints?|pt|packages?|pkg|jars?|heads?|stalks?|large|medium|small";
const ING_RE = new RegExp("^((?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d*[½⅓⅔¼¾⅛⅜⅝⅞]|\\d+(?:\\.\\d+)?)(?:\\s*[-–]\\s*(?:\\d+\\/\\d+|\\d+(?:\\.\\d+)?))?\\s*(?:(?:" + UNITS + ")\\b\\.?)?)\\s*(.+)$", "i");
function cleanLine(l){ return l.replace(/^\s*(?:[-*•·▪◦–]|\[\s?\]|☐)\s*/, "").trim(); }
function splitIngredient(line){
  line = cleanLine(line);
  let url = "";
  const um = line.match(/https?:\/\/\S+/);
  if (um){ url = safeUrl(um[0].replace(/[).,]+$/,"")); line = line.replace(um[0], "").replace(/[\s|–-]+$/,"").trim(); }
  const m = line.match(ING_RE);
  if (m && m[2]) return {qty:m[1].trim(), item:m[2].trim(), url};
  return {qty:"", item:line, url};
}
const ING_WORDS = "ingredients?";
const STEP_WORDS = "directions|instructions|method|steps|preparation";
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
function partHeader(raw, sec){
  const low = raw.toLowerCase().replace(/[:\s]+$/,"").trim();
  let m;
  if ((m = low.match(new RegExp("^(?:" + ING_WORDS + ")\\s+for\\s+(?:the\\s+)?(.{2,40})$")))) return {sec:"ing", name:m[1]};
  if ((m = low.match(new RegExp("^(.{2,40}?)\\s+(?:" + ING_WORDS + ")$")))) return {sec:"ing", name:m[1]};
  if ((m = low.match(new RegExp("^(?:" + STEP_WORDS + ")\\s+for\\s+(?:the\\s+)?(.{2,40})$")))) return {sec:"steps", name:m[1]};
  if ((m = low.match(new RegExp("^(.{2,40}?)\\s+(?:" + STEP_WORDS + ")$")))) return {sec:"steps", name:m[1]};
  if (sec !== "ing" && sec !== "steps") return null;
  if ((m = low.match(/^(?:for|to make)\s+(?:the\s+)?([a-z][a-z '&-]{1,38})$/))) return {sec, name:m[1]};
  if (/:\s*$/.test(raw) && (m = low.match(/^([a-z][a-z '&-]{1,30})$/)) && m[1].split(/\s+/).length <= 4) return {sec, name:m[1]};
  return null;
}
function parseRecipeText(text){
  const lines = text.split(/\r?\n/).map(s => s.trim());
  const out = {title:"", mainName:"", ingredients:[], steps:[], parts:[], equipment:[], notes:[], sourceUrl:"", servings:0, prepMin:0, cookMin:0};
  let sec = "head", cur = 0;
  const target = () => cur === 0 ? out : out.parts[cur - 1];
  const switchTo = (name, inSec) => {
    name = capFirst(name.replace(/^the\s+/i, "").trim());
    const key = name.toLowerCase();
    if (out.mainName && out.mainName.toLowerCase() === key){ cur = 0; return; }
    const at = out.parts.findIndex(p => p.name.toLowerCase() === key);
    if (at >= 0){ cur = at + 1; return; }
    const mainEmpty = inSec === "ing" ? !out.ingredients.length : !out.steps.length;
    if (!out.mainName && mainEmpty && !out.parts.length){ out.mainName = name; cur = 0; return; }
    out.parts.push({name, ingredients:[], steps:[]}); cur = out.parts.length;
  };
  for (const raw of lines){
    if (!raw) continue;
    const low = raw.toLowerCase().replace(/[:\s]+$/,"");
    if (/^(ingredients?|what you.ll need|you.ll need)$/.test(low)){ sec = "ing"; cur = 0; continue; }
    if (/^(directions|instructions|method|steps|preparation|how to make it)$/.test(low)){ sec = "steps"; cur = 0; continue; }
    if (/^(notes?|tips?)$/.test(low)){ sec = "notes"; continue; }
    if (/^(equipment|tools|kitchen tools|tools (?:and|&) equipment|equipment needed|special equipment|you.ll also need)$/.test(low)){ sec = "equip"; continue; }
    if (sec === "equip"){ const e = cleanLine(raw); if (e) out.equipment.push(e); continue; }
    const ph = partHeader(raw, sec);
    if (ph){ sec = ph.sec; switchTo(ph.name, ph.sec); continue; }
    const um = raw.match(/https?:\/\/\S+/);
    if (um && !out.sourceUrl && (sec === "head" || /^source/i.test(raw) || sec === "notes")){ out.sourceUrl = safeUrl(um[0].replace(/[).,]+$/,"")); if (/^\s*(source|from|via)?\s*:?\s*https?:/i.test(raw)) continue; }
    let m;
    if ((m = raw.match(/(?:serves|servings|yield|makes)\s*:?\s*(\d+)/i))) { out.servings = +m[1]; if (sec === "head") continue; }
    if ((m = raw.match(/prep(?:\s*time)?\s*:?\s*(\d+)\s*(h|hr|hour|m|min)/i))) { out.prepMin = /^h/i.test(m[2]) ? m[1]*60 : +m[1]; }
    if ((m = raw.match(/cook(?:\s*time)?\s*:?\s*(\d+)\s*(h|hr|hour|m|min)/i))) { out.cookMin = /^h/i.test(m[2]) ? m[1]*60 : +m[1]; }
    if (sec === "head"){ if (!out.title && !/^(prep|cook|total|serves|servings|source)/i.test(raw)) out.title = raw.replace(/^#+\s*/,""); continue; }
    if (sec === "ing") target().ingredients.push(splitIngredient(raw));
    else if (sec === "steps") target().steps.push(cleanLine(raw).replace(/^(?:step\s*)?\d+\s*[.):-]\s*/i, ""));
    else if (sec === "notes") out.notes.push(cleanLine(raw));
  }
  return out;
}

const CFG = window.RECIPE_BOX_CONFIG || {};
let sb = null;
const FAV_KEY = "recipe-box-favs";
function loadFavs(){ try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); }catch(e){ return new Set(); } }
function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify([...state.favs])); }catch(e){} }
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); }catch(e){}
  return null;
}

  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.recipes)); }catch(e){}
}
function rowToRecipe(row){ return Object.assign({}, row.data, {id: row.id, userId: row.user_id, fav: state.favs.has(row.id)}); }
async function refresh(){
  try{
    const { data, error } = await sb.from("recipes").select("id,user_id,data");
    if (error) throw error;
    state.recipes = data.map(rowToRecipe);
    state.stale = false;
  }catch(e){ state.stale = true; }
  if (state.mode === "loading") state.mode = "db";
  render();
  if (state.openId) renderDetail();
}
function cleanBody(r){
  const body = JSON.parse(JSON.stringify(r));
  delete body.id; delete body.userId; delete body.fav;
  return body;
}
async function persist(r){
  if (state.mode === "db"){
    const exists = state.recipes.some(x => x.id === r.id);
    const q = exists
      ? sb.from("recipes").update({data: cleanBody(r)}).eq("id", r.id).select("id")
      : sb.from("recipes").insert({id: r.id, data: cleanBody(r)}).select("id");
    const { data, error } = await q;
    if (error) throw error;
    if (!data || !data.length) throw {code: "denied"};
    await refresh();
  } else {
    const i = state.recipes.findIndex(x => x.id === r.id);
    if (i >= 0) state.recipes[i] = r; else state.recipes.push(r);
    saveLocal(); render();
  }
}
async function removeRecipe(id){
  if (state.mode === "db"){
    const { data, error } = await sb.from("recipes").delete().eq("id", id).select("id");
    if (error) throw error;
    if (!data || !data.length) throw {code: "denied"};
    await refresh();
  } else { state.recipes = state.recipes.filter(x => x.id !== id); saveLocal(); render(); }
}
async function uploadFile(blob, ext, type){
  const path = state.session.user.id + "/" + newId() + "." + ext;
  const { error } = await sb.storage.from("media").upload(path, blob, {contentType: type, upsert: false});
  if (error) throw error;
  return { path, url: sb.storage.from("media").getPublicUrl(path).data.publicUrl };
}
function removeFile(path){ if (sb && path) sb.storage.from("media").remove([path]).catch(() => {}); }
function writeError(e){
  if (e && e.code === "denied") return "Only the person who added this recipe (or the box owner) can change it.";
  if (!state.session && state.mode === "db") return "Sign in to make changes.";
  const msg = String((e && (e.message || e.error)) || "");
  if (/exceed|too large|payload/i.test(msg)) return "That file is too big. Photos and videos can be up to 50 MB.";
  return "Couldn't save just now. Check your connection and try again.";
}
function canEdit(r){

}

    '<p class="hint" style="margin:0">' + (mode === "up" ? 'Already have an account? <button class="link-btn" type="button" data-c="in">Sign in</button>' : 'New here? <button class="link-btn" type="button" data-c="up">Create an account</button>') + '</p>' +

        : /already registered/i.test(m) ? "That email already has an account. Sign in instead."
        : m || "Couldn't sign in. Check your connection and try again.";
    }
  };
}

/* ---------- views ---------- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  let list = state.recipes.filter(r => (state.meal === "all" || r.meal === state.meal) && (!state.favOnly || r.fav) && (state.by === "all" || (r.publishedBy||"") === state.by));
  if (q){
    list = list.filter(r => [r.title, (r.tags||[]).join(" "), allIngredients(r).map(i => i.item).join(" "), partsOf(r).map(p => p.name).join(" "), (r.equipment||[]).join(" "), r.notes].join(" ").toLowerCase().includes(q));
  }
  const s = state.sort;
  list.sort((a,b) => s === "az" ? String(a.title).localeCompare(String(b.title))
    : s === "quick" ? (totalMin(a)||9999) - (totalMin(b)||9999)
    : s === "rating" ? (num(b.rating) - num(a.rating)) || String(a.title).localeCompare(String(b.title))
    : s === "made" ?(num(b.madeCount) - num(a.madeCount)) || ((b.lastMade||0) - (a.lastMade||0))
    : (b.createdAt||0) - (a.createdAt||0));
  return list;
}

  const letter = (String(r.title||"?").trim()[0] || "?").toUpperCase();

function videoSite(u){

}

function photoSrc(r){

function stars(n, inline){

/* Recommendations: score recipes against what you've made (or favorited). */
const SKIP = new Set("salt pepper black kosher oil olive vegetable water sugar flour purpose all butter unsalted egg eggs milk vanilla extract baking powder soda chopped diced sliced minced fresh large small medium ground grated dried drained whole cup cups can cans and the for into of to taste optional room temperature juice zest juiced zested cloves clove".split(" "));
function keyWords(r){
  const s = new Set();
  allIngredients(r).forEach(i => String(i.item||"").toLowerCase().split(/[,(]/)[0].replace(/[^a-z\s]/g," ").split(/\s+/).forEach(w => {
    if (w.length > 2 && !SKIP.has(w)) s.add(w.endsWith("s") && w.length > 4 && !w.endsWith("ss") ? w.slice(0,-1) : w);
  }));
  return s;
}
function tasteBasis(){
  const made = state.recipes.filter(r => num(r.madeCount) > 0);
  if (made.length) return {basis: made, word: "recipes you've made", fromMade: true};
  const favs = state.recipes.filter(r => r.fav);
  if (favs.length) return {basis: favs, word: "your favorites"};
  const top = state.recipes.filter(r => num(r.rating) >= 4);
  if (top.length) return {basis: top, word: "your top-rated recipes"};
  return null;
}
function tasteWords(){
  const tb = tasteBasis();
  const src = tb ? tb.basis : state.recipes;
  const words = new Map();
  src.forEach(r => { const w = (num(r.madeCount) || 1) + num(r.rating) / 5; keyWords(r).forEach(k => words.set(k, (words.get(k)||0) + w)); String(r.title||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).forEach(k => { if (k.length > 3 && !SKIP.has(k)) words.set(k, (words.get(k)||0) + w); }); });
  return words;
}
function recommend(){
  const tb = tasteBasis();
  if (!tb) return null;
  const basis = tb.basis, made = tb.fromMade ? basis : [];
  const words = new Map(), tags = new Map(), meals = new Map();
  basis.forEach(r => {
    const w = num(r.madeCount) || 1;
    keyWords(r).forEach(k => words.set(k, (words.get(k)||0) + w));
    (r.tags||[]).filter(t => t !== "Example").forEach(t => tags.set(t, (tags.get(t)||0) + w));
    meals.set(r.meal, (meals.get(r.meal)||0) + w);
  });
  const basisIds = new Set(basis.map(r => r.id));
  let best = null;
  state.recipes.forEach(r => {
    if (basisIds.has(r.id)) return;
    let sc = 0; const shared = [];
    keyWords(r).forEach(k => { if (words.has(k)){ sc += words.get(k); shared.push(k); } });
    (r.tags||[]).forEach(t => { if (tags.has(t)) sc += 2 * tags.get(t); });
    sc += (meals.get(r.meal)||0) * 0.5;
    if (!best || sc > best.sc) best = {r, sc, shared};
  });
  if (!best){
    const r = [...basis].sort((a,b) => (a.lastMade||0) - (b.lastMade||0))[0];
    best = {r, sc:0, shared:[], again:true};
  }
  const top = [...words.entries()].sort((a,b) => b[1] - a[1]).map(e => e[0]).slice(0,2);
  const topMeal = [...meals.entries()].sort((a,b) => b[1] - a[1])[0][0];
  return {best, basisWord: tb.word, top, topMeal};
}
function renderRecs(){
  const box = $("#recs");

  const rec = show ? recommend() : null;

};
const P_DESC = new Set("fresh freshly chopped diced sliced minced grated ground dried large small medium whole drained rinsed shredded softened melted room temperature cup cups of the a an and or to taste optional finely roughly thinly cold warm hot boneless skinless extra virgin all purpose ripe peeled seeded cubed packed light dark heaping divided plus more for serving garnish about into piece pieces inch can cans jar package bag bunch handful clove cloves tbsp tsp lb lbs oz pinch dash stick sticks slice slices head heads".split(" "));
function sing(w){
  if (w.length > 4 && w.endsWith("ies")) return w.slice(0,-3) + "y";
  if (w.length > 4 && /(oes|ches|shes|sses)$/.test(w)) return w.slice(0,-2);
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0,-1);

function coreTokens(s){
  const first = String(s||"").toLowerCase().replace(/\([^)]*\)/g, " ").split(/,|\s[-–]\s/)[0];

}
function loadPantryLocal(){

const pantryUid = () => state.session && state.session.user && state.session.user.id;
async function loadPantry(){
  if (state.mode !== "db" || !pantryUid()){ state.pantrySync = "local"; renderPantryIfOpen(); return; }
  try{
    const { data, error } = await sb.from("pantries").select("data").eq("user_id", pantryUid()).maybeSingle();

    const have = new Set(base.map(i => nameKey(i.name)));

  let added = 0; const bumped = [];
  names.map(n => String(n||"").trim().replace(/\s+/g, " ")).filter(Boolean).forEach(name => {

    const hit = findPantry(name);

}
function routeFromHash(){
  const id = location.hash.slice(1);
  if (id && state.recipes.some(r => r.id === id)) openDetail(id);
  else if (!id && state.openId) closeDetail();
}
function embedFor(u){
  const url = safeUrl(u); if (!url) return null;
  const x = new URL(url); const h = x.hostname.replace(/^(www|m)\./, "");
  let m;
  if (/(^|\.)youtube\.com$/.test(h)){
    if ((m = x.pathname.match(/^\/shorts\/([\w-]{6,})/))) return {kind:"youtube", id:m[1], tall:true};
    if ((m = x.pathname.match(/^\/(?:embed|live)\/([\w-]{6,})/))) return {kind:"youtube", id:m[1]};
    const v = x.searchParams.get("v"); if (v && /^[\w-]{6,}$/.test(v)) return {kind:"youtube", id:v};
  }
  if (h === "youtu.be"){ const id = x.pathname.slice(1).split("/")[0]; if (/^[\w-]{6,}$/.test(id)) return {kind:"youtube", id}; }
  if (/(^|\.)instagram\.com$/.test(h) && (m = x.pathname.match(/^\/(p|reel|reels|tv)\/([\w-]+)/))) return {kind:"instagram", type: m[1] === "reels" ? "reel" : m[1], id:m[2]};
  if (/(^|\.)tiktok\.com$/.test(h)){
    if ((m = x.pathname.match(/\/video\/(\d+)/))) return {kind:"tiktok", id:m[1]};
    return {kind:"tiktok-short", url};
  }
  return null;
}
async function resolveTikTok(url){
  if (state.tiktok[url] !== undefined) return state.tiktok[url];
  state.tiktok[url] = null;
  try{
    const res = await fetch("https://www.tiktok.com/oembed?url=" + encodeURIComponent(url));
    const j = await res.json();
    const id = String(j.embed_product_id || (String(j.html || "").match(/data-video-id="(\d+)"/) || [])[1] || "");
    state.tiktok[url] = /^\d+$/.test(id) ? id : "";
  }catch(e){ state.tiktok[url] = ""; }
  return state.tiktok[url];
}
function embedHtml(e){
  if (!e) return "";
  if (e.kind === "youtube") return '<div class="embed ' + (e.tall ? "tall" : "wide") + '"><iframe src="https://www.youtube.com/embed/' + esc(e.id) + '" title="Recipe video" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>';
  if (e.kind === "instagram") return '<div class="embed insta"><iframe src="https://www.instagram.com/' + e.type + '/' + esc(e.id) + '/embed/" title="Recipe video" loading="lazy" allowfullscreen></iframe></div>';
  if (e.kind === "tiktok") return '<div class="embed tall"><iframe src="https://www.tiktok.com/embed/v2/' + esc(e.id) + '" title="Recipe video" loading="lazy" allow="encrypted-media; fullscreen" allowfullscreen></iframe></div>';
  return "";
}
function videoSection(r){
  const site = videoSite(r.sourceUrl);
  const src = safeUrl(r.sourceUrl);
  const own = videoSrc(r);
  if (!own && !site) return "";
  let emb = embedFor(src);
  let embedPart = "";
  if (emb && emb.kind === "tiktok-short"){
    const known = r.tiktokId || state.tiktok[src];
    if (known) emb = {kind:"tiktok", id: known};
    else if (known === undefined){ resolveTikTok(src).then(id => { if (id && state.openId === r.id) renderDetail(); }); embedPart = '<p class="hint">Loading the TikTok video…</p>'; emb = null; }
    else { emb = null; embedPart = '<p class="hint">TikTok wouldn\'t share the player for this short link.' + (canEdit(r) ? ' Edit the recipe and paste the full video link (it looks like tiktok.com/@name/video/123…) to show it here.' : '') + '</p>'; }
  }
  if (emb) embedPart = embedHtml(emb);
  return '<section style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:24px">Video</h3>' +
    (own ? '<div class="video-box"><video controls playsinline preload="metadata" src="' + esc(own) + '"></video></div>' : "") +
    (!own ? embedPart : "") +
    (site ? '<div class="watch-row"><a class="btn yolk" href="' + esc(src) + '" target="_blank" rel="noopener noreferrer">▶ Open on ' + site + '</a></div>' : "") +
  '</section>';
}

      d.parts.map((p, pi) =>
        '<div class="part-box" data-part="' + pi + '">' +

        '<span class="hint">For recipes made of more than one piece, like a sauce, dressing, crust, filling, marinade, frosting or a side. Each part gets its own name, ingredients and steps.</span></div>' +
      '<div class="row">' +

      '</div>' +

      '<div class="field"><label for="f-notes">Notes</label><textarea class="inp" id="f-notes" rows="3" placeholder="Swaps, tips, who loved it">' + esc(d.notes) + '</textarea></div>' +

      '<div class="form-foot"><button class="btn ghost" type="button" data-act="fclose">Cancel</button><button class="btn primary" type="submit" id="saveBtn">' + (d._isNew ? "Add to recipe box" : "Save changes") + '</button></div>' +

}
function syncDraft(){
  const f = $("#formSheet");
  if (!f || !draft) return;
  draft.title = $("#f-title", f).value.trim();
  const m = f.querySelector('input[name="meal"]:checked'); if (m) draft.meal = m.value;
  draft.prepMin = $("#f-prep", f).value; draft.cookMin = $("#f-cook", f).value; draft.servings = $("#f-serv", f).value;
  const readRows = box => [...box.querySelectorAll(".ing-row")].map(row => ({
    qty: row.querySelector('[data-k="qty"]').value.trim(),
    item: row.querySelector('[data-k="item"]').value.trim(),
    url: row.querySelector('[data-k="url"]').value.trim()
  }));
  const readSteps = ta => ta.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  draft.ingredients = readRows($("#ingRows", f));
  draft.steps = readSteps($("#f-steps", f));
  draft.equipment = readSteps($("#f-equip", f));
  const mn = $("#f-mainname", f); if (mn) draft.mainName = mn.value.trim();
  draft.parts = [...f.querySelectorAll(".part-box[data-part]")].map(box => ({
    name: box.querySelector(".part-name").value.trim(),
    ingredients: readRows(box.querySelector(".ing-rows")),
    steps: readSteps(box.querySelector(".part-steps"))
  }));
  draft.sourceUrl = $("#f-src", f).value.trim();
  draft.sourceName = $("#f-srcname", f).value.trim();
  draft.tags = $("#f-tags", f).value.split(",").map(s => s.trim()).filter(Boolean);
  draft.notes = $("#f-notes", f).value.trim();
  draft.publishedBy = $("#f-by", f).value.trim();
  draft.rating = num($("#f-rating", f).value);
}

async function shrinkImage(file, max, q){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w*s); c.height = Math.round(h*s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b), "image/jpeg", q));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataUrl = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });

async function takeFile(file){
  if (!file || !draft) return;
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|heic)$/i.test(file.name)){ toast("That file isn't a photo. Try a JPG or PNG."); return; }
  syncDraft();
  try{
    const blob = await shrinkImage(file, 1600, 0.85);
    if (!blob) throw new Error("no blob");
    if (draft._preview && draft._preview.startsWith("blob:")) URL.revokeObjectURL(draft._preview);
    draft._newBlob = blob; draft._preview = URL.createObjectURL(blob); draft._removePhoto = false;
    renderForm();
  }catch(e){ toast("Couldn't read that photo. Try saving it as a JPG or PNG first."); }
}

async function saveForm(){
  syncDraft();
  const err = $("#fErr");
  if (!draft.title){ err.textContent = "Give the recipe a name before saving."; $("#f-title").focus(); return; }
  if (!draft.publishedBy){ err.textContent = "Add your name under Published by so everyone knows whose recipe it is."; $("#f-by").focus(); return; }
  if (draft.sourceUrl && !safeUrl(draft.sourceUrl)){ err.textContent = "The source link needs to start with http:// or https://."; $("#f-src").focus(); return; }
  const badLink = draft.ingredients.concat(...draft.parts.map(p => p.ingredients)).find(i => i.url && !safeUrl(i.url));
  if (badLink){ err.textContent = "The link for “" + (badLink.item || "an ingredient") + "” needs to start with http:// or https://."; return; }
  err.textContent = "";
  const btn = $("#saveBtn"); btn.disabled = true; btn.textContent = "Saving…";

  const prev = state.recipes.find(x => x.id === draft.id);
  const cleanIngs = list => list.filter(i => i.item || i.qty).map(i => ({qty:i.qty, item:i.item, url: safeUrl(i.url)}));
  const keptParts = draft.parts.map(p => ({name: p.name, ingredients: cleanIngs(p.ingredients), steps: p.steps}))
    .filter(p => p.name || p.ingredients.length || p.steps.length);
  const out = {
    id: draft.id, title: draft.title, meal: draft.meal,
    prepMin: num(draft.prepMin), cookMin: num(draft.cookMin), servings: num(draft.servings),
    ingredients: cleanIngs(draft.ingredients),
    steps: draft.steps, equipment: draft.equipment || [],
    mainName: keptParts.length ? draft.mainName : "",
    parts: keptParts, tags: draft.tags, notes: draft.notes,
    sourceUrl: safeUrl(draft.sourceUrl), sourceName: draft.sourceName,
    fav: !!draft.fav, createdAt: draft.createdAt || Date.now(), updatedAt: Date.now(),
    publishedBy: draft.publishedBy || "", rating: Math.min(5, num(draft.rating)), madeCount: num(draft.madeCount), lastMade: draft.lastMade || 0,
    photoUrl: draft._removePhoto ? "" : (draft.photoUrl || ""),
    photoPath: draft._removePhoto ? "" : (draft.photoPath || ""),
    photoData: draft._removePhoto ? "" : (draft.photoData || ""),
    videoUrl: draft._removeVideo ? "" : (draft.videoUrl || ""),
    videoPath: draft._removeVideo ? "" : (draft.videoPath || ""),
    tiktokId: draft.tiktokId || ""
  };
  const oldPhotoPath = prev && prev.photoPath;
  const oldVideoPath = prev && prev.videoPath;
  try{
    if (draft._newBlob){
      if (state.mode === "db"){
        const up = await uploadFile(draft._newBlob, "jpg", "image/jpeg");
        out.photoUrl = up.url; out.photoPath = up.path; out.photoData = "";
      } else {
        const small = await shrinkImage(draft._newBlob, 1100, 0.72);
        out.photoData = await blobToDataUrl(small);
      }
    }
    if (draft._newVideo && state.mode === "db"){
      btn.textContent = "Uploading video…";
      const webm = draft._newVideo.type === "video/webm";
      const upv = await uploadFile(draft._newVideo, webm ? "webm" : "mp4", webm ? "video/webm" : "video/mp4");
      out.videoUrl = upv.url; out.videoPath = upv.path;
    }
    const emb = embedFor(out.sourceUrl);
    if (emb && emb.kind === "tiktok-short" && !out.tiktokId){ out.tiktokId = await resolveTikTok(out.sourceUrl) || ""; }
    else if (!emb || emb.kind !== "tiktok-short") out.tiktokId = "";
    await persist(out);
    if (oldVideoPath && oldVideoPath !== out.videoPath) removeFile(oldVideoPath);
    if (out.publishedBy){ try{ localStorage.setItem("recipe-box-name", out.publishedBy); }catch(e){} }
    if (oldPhotoPath && oldPhotoPath !== out.photoPath) removeFile(oldPhotoPath);
    const wasNew = draft._isNew;
    closeForm();
    toast(wasNew ? "Added to your recipe box." : "Saved.");
    openDetail(out.id);
  }catch(e){
    btn.disabled = false; btn.textContent = draft && draft._isNew ? "Add to recipe box" : "Save changes";
    const code = e && e.code;
    err.textContent = code === "too_large" ? "That file is too big. Try a smaller one."
      : writeError(e);
  }
}

/* ---------- confirm ---------- */
function confirmBox(title, body, yes){
  return new Promise(res => {
    const ov = $("#confirmOv");
    ov.innerHTML = '<div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cT"><h3 id="cT">' + esc(title) + '</h3><p>' + esc(body) + '</p><div class="acts"><button class="btn ghost" type="button" data-c="0">Keep it</button><button class="btn danger" type="button" data-c="1">' + esc(yes) + '</button></div></div>';
    ov.hidden = false;
    const done = v => { ov.hidden = true; ov.innerHTML = ""; res(v); };
    ov.onclick = e => { const b = e.target.closest("[data-c]"); if (b) done(b.dataset.c === "1"); else if (e.target === ov) done(false); };
    ov.querySelector('[data-c="0"]').focus();
  });
}

function toggleFav(id){
  const r = state.recipes.find(x => x.id === id); if (!r) return;
  r.fav = !r.fav;
  if (r.fav) state.favs.add(id); else state.favs.delete(id);
  saveFavs();
  if (state.mode === "local") saveLocal();
  render(); if (state.openId) renderDetail();
}

document.addEventListener("click", async e => {
  const t = e.target;
  const padd = t.closest("[data-padd]");
  if (padd){ e.stopPropagation(); const n = padd.dataset.padd; const res = addToPantry([n]); if (res.count) toast(pantryMsg(res)); renderPantryIfOpen(); return; }
  const pdel = t.closest("[data-pdel]");
  if (pdel){ removeFromPantry(pdel.dataset.pdel); renderPantryIfOpen(); return; }
  const fav = t.closest("[data-fav]");
  if (fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const tab = t.closest(".tab");
  if (tab){ state.meal = tab.dataset.meal; render(); return; }
  const open = t.closest("[data-open]");
  if (open){ openDetail(open.dataset.open); return; }
  const stepEl = t.closest("[data-step]");
  if (stepEl){ const i = stepEl.dataset.step; state.checkedSteps.has(i) ? state.checkedSteps.delete(i) : state.checkedSteps.add(i); stepEl.classList.toggle("done"); return; }
  const act = t.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  const r = state.recipes.find(x => x.id === state.openId);
  switch(a){
    case "new": if (state.mode === "db" && !state.session){ openSignIn("in"); break; } openForm(null); break;
    case "signin": openSignIn("in"); break;
    case "signout": await sb.auth.signOut(); toast("Signed out."); break;
    case "clear": state.q = ""; $("#q").value = ""; state.meal = "all"; state.favOnly = false; render(); break;
    case "close": closeDetail(); break;
    case "made": {
      if (!r) break;
      if (state.mode === "db" && !state.session){ openSignIn("in"); break; }
      try{
        if (state.mode === "db"){ const { error } = await sb.rpc("log_made", {rid: r.id}); if (error) throw error; await refresh(); }
        else { Object.assign(r, {madeCount: num(r.madeCount) + 1, lastMade: Date.now()}); saveLocal(); render(); renderDetail(); }
        toast("Nice! Logged it. Your picks will learn from this.");
      }catch(err){ toast(writeError(err)); }
      break;
    }
    case "edit": if (r) openForm(r); break;
    case "delete":
      if (r && await confirmBox("Delete “" + r.title + "”?", "This removes the recipe and its photo for good.", "Delete recipe")){
        try{
          await removeRecipe(r.id);
          removeFile(r.photoPath); removeFile(r.videoPath);
          closeDetail(); toast("Recipe deleted.");
        }catch(err){ toast(writeError(err)); }
      }
      break;
    case "sv-": case "sv+": {
      const base = num(r && r.servings); if (!base) break;
      const cur = state.servings || base, steps = servingSteps(r);
      const next = a === "sv+" ? steps.find(s => s > cur) : [...steps].reverse().find(s => s < cur);
      if (next == null){ toast(a === "sv+" ? "That's as big as this recipe scales." : "That's as small as this recipe goes. Some amounts would be too small to measure."); break; }
      state.servings = next;
      renderDetail(); break;
    }
    case "copy": {
      if (!r) break;
      const base = num(r.servings), f = base ? (state.servings || base) / base : 1;
      const text = r.title + "\n" + totalIngredients(r, f).map(t => "- " + [t.qty, t.item].filter(Boolean).join(" ")).join("\n");
      try{ await navigator.clipboard.writeText(text); toast("Ingredients copied. Paste them into your shopping list."); }
      catch(err){ toast("Your browser blocked copying. Select the list and copy it by hand."); }
      break;
    }
    case "fclose": closeForm(); break;
    case "to-total": { const el = $("#totalList"); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); break; }
    case "pclose": closePantry(); break;
    case "cclose": closeCook(); break;
    case "cook": closePantry(); openCook(); break;
    case "pantry": closeCook(); openPantry(); break;
    case "surprise": {
      const {ready} = cookMatches(); if (!ready.length) break;
      openDetail(ready[Math.floor(Math.random() * ready.length)].r.id); break;
    }
    case "p-bulk-add": {
      const names = $("#p-bulk").value.split(/[\r\n,;]+/);
      const res = addToPantry(names);
      if (res.count) toast(pantryMsg(res));
      renderPantry(); break;
    }
    case "p-clear":
      if (await confirmBox("Empty your pantry?", "This removes all " + state.pantry.items.length + " items from your pantry. Your recipes aren't touched.", "Empty pantry")){
        state.pantry.items = []; savePantry(); renderPantryIfOpen();
      }
      break;
    case "save": saveForm(); break;
    case "pick": $("#fileInp").click(); break;
    case "pick-video": $("#vidInp").click(); break;
    case "rm-video": syncDraft(); if (draft._videoPreview) URL.revokeObjectURL(draft._videoPreview); draft._newVideo = null; draft._videoPreview = ""; draft._removeVideo = true; renderForm(); break;
    case "rm-photo": syncDraft(); if (draft._preview && draft._preview.startsWith("blob:")) URL.revokeObjectURL(draft._preview); draft._newBlob = null; draft._preview = ""; draft._removePhoto = true; renderForm(); break;
    case "add-ing": {
      const pi = +act.closest(".ing-block").dataset.part;
      syncDraft(); (pi < 0 ? draft.ingredients : draft.parts[pi].ingredients).push(blankIng()); renderForm();
      const rows = document.querySelectorAll('.ing-block[data-part="' + pi + '"] .ing-row'); rows[rows.length-1].querySelector("input").focus(); break;
    }
    case "rm-ing": {
      act.closest(".ing-row").remove(); syncDraft();
      const lists = [draft.ingredients].concat(draft.parts.map(p => p.ingredients));
      if (lists.some(l => !l.length)){ lists.forEach(l => { if (!l.length) l.push(blankIng()); }); renderForm(); }
      break;
    }
    case "bulk": { const b = act.closest(".ing-block").querySelector(".bulk-box"); b.hidden = !b.hidden; if (!b.hidden) b.querySelector("textarea").focus(); break; }
    case "bulk-add": {
      const block = act.closest(".ing-block"), pi = +block.dataset.part;
      const lines = block.querySelector(".bulk-inp").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      syncDraft();
      if (!lines.length) break;
      const merged = (pi < 0 ? draft.ingredients : draft.parts[pi].ingredients).filter(i => i.item || i.qty).concat(lines.map(splitIngredient));
      if (pi < 0) draft.ingredients = merged; else draft.parts[pi].ingredients = merged;
      renderForm(); toast("Added " + lines.length + " ingredient" + (lines.length === 1 ? "" : "s") + "."); break;
    }
    case "add-part": {
      syncDraft(); draft.parts.push({name:"", ingredients:[blankIng()], steps:[]}); renderForm();
      const el = $("#f-pname" + (draft.parts.length - 1)); if (el){ el.focus(); el.scrollIntoView({block:"center"}); }
      break;
    }
    case "rm-part": {
      syncDraft(); const pi = +act.dataset.part, p = draft.parts[pi];
      const hasStuff = p && (p.steps.length || p.ingredients.some(i => i.item || i.qty));
      if (hasStuff && !await confirmBox("Remove “" + (p.name || "Part " + (pi + 2)) + "”?", "Its ingredients and steps will be taken out of this recipe when you save.", "Remove part")) break;
      draft.parts.splice(pi, 1); renderForm(); break;
    }
    case "parse": {
      syncDraft();
      const txt = $("#f-paste").value;
      if (!txt.trim()){ toast("Paste a recipe into the box first."); break; }
      const p = parseRecipeText(txt);
      if (p.title) draft.title = p.title;
      if (p.ingredients.length) draft.ingredients = p.ingredients;
      if (p.steps.length) draft.steps = p.steps;
      if (p.parts.length){ draft.mainName = p.mainName; draft.parts = p.parts.map(x => ({name:x.name, ingredients: x.ingredients.length ? x.ingredients : [blankIng()], steps:x.steps})); }
      else if (p.mainName && !draft.mainName) draft.mainName = p.mainName;
      if (p.notes.length) draft.notes = p.notes.join("\n");
      if (p.equipment.length) draft.equipment = p.equipment;
      if (p.sourceUrl) draft.sourceUrl = p.sourceUrl;
      if (p.servings) draft.servings = p.servings;
      if (p.prepMin) draft.prepMin = p.prepMin;
      if (p.cookMin) draft.cookMin = p.cookMin;
      renderForm();
      const nIng = p.ingredients.length + p.parts.reduce((a, x) => a + x.ingredients.length, 0);
      const nSteps = p.steps.length + p.parts.reduce((a, x) => a + x.steps.length, 0);
      toast("Found " + nIng + " ingredients and " + nSteps + " steps" + (p.parts.length ? " in " + (p.parts.length + 1) + " parts" : "") + ". Check them over, then save.");
      break;
    }
  }
});

["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.remove("over"); takeFile(e.dataTransfer.files[0]); } });
document.addEventListener("paste", e => {
  if ($("#formOv").hidden || !draft) return;
  const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => /^image\//.test(x.type));
  if (f){ e.preventDefault(); takeFile(f); }
});
window.addEventListener("hashchange", routeFromHash);

init();
})();
</script>
